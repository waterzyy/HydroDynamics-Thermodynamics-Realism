name: Diagnose

on:
  push:
    branches: ["arena/**"]

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Collect diagnostics
        run: |
          set +e
          {
            echo "### cargo check (short)"
            cargo check --all-targets --message-format=short 2>&1 | grep -E "error|warning" | grep -v "^ *Compiling" | head -120
            echo "### cargo test"
            cargo test --all-targets 2>&1 | grep -E "^(test result|failures:)" | head -40
            echo "### failures"
            cargo test --all-targets 2>&1 | grep -B2 -A8 "panicked at" | head -150
            echo "### wasm build"
            cargo build --release --target wasm32-unknown-unknown --message-format=short 2>&1 | tail -30
            ls -l target/wasm32-unknown-unknown/release/*.wasm 2>/dev/null || true
          } > /tmp/report.txt
          cp /tmp/report.txt /tmp/report_tail.txt
          wc -c /tmp/report.txt
      - name: Post report as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          body = open('/tmp/report_tail.txt').read()
          payload = json.dumps({"body": "```\n" + body[-60000:] + "\n```"})
          open('/tmp/payload.json','w').write(payload)
          PY
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/payload.json
