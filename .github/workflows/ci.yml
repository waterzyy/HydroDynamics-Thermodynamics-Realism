name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Unit + integration tests
        run: cargo test --all-targets -- --nocapture
      - name: Documentation builds
        run: cargo doc --no-deps

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the cdylib
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Check the artifact is self-contained
        run: |
          size=$(wc -c < target/wasm32-unknown-unknown/release/hydrodynamics.wasm)
          echo "wasm size: $size bytes"
          test "$size" -lt 2097152 || (echo "artifact too large" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: hydrodynamics-wasm
          path: target/wasm32-unknown-unknown/release/hydrodynamics.wasm

  fmt:
    name: Formatting (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
